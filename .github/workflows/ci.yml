name: ci

on:
  push:
  pull_request:

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install public CPU dependencies
        run: python -m pip install -e .
      - name: CLI import smoke tests
        run: |
          python run.py --help
          python aesthetic_eval_score_framework/run.py --help
      - name: Compile public Python sources
        run: python -m compileall -q run.py src scripts aesthetic_eval_score_framework
      - name: Public artifact boundary
        run: python scripts/check_release_integrity.py
